modules:
  - module: QDU-Robomaster/WebotsReferee
    id: WebotsReferee_0
    args:
      - param:
          bullet_speed: 23.0
          shooter_heat_limit: '240.0f'
          shooter_cooling_value: '40.0f'
          robot_id: '7'
          robot_level: '1'
          max_hp: '200'
          chassis_power_limit: '45'
          publish_period_ms: '100'
  - module: QDU-Robomaster/WebotsCamera
    id: WebotsCamera_0
    template_args:
      - 'AutoAimRunConfig::Webots::MainFrameLayout'
    args:
      - ramfs: ramfs
      - calibration: 'AutoAimRunConfig::Webots::MainCameraCalibration'
      - runtime:
          device_name: '"camera"'
          fps: 100
          exposure: 0.8
          gain: 0.0
          pose_def_name: '"camera"'
          image_topic_name: 'AutoAimRunConfig::Webots::MainImageTopicName'
          imu_topic_name: 'AutoAimRunConfig::Webots::MainImuTopicName'
          raw_topic_domain_name: '"libxr_def_domain"'
          trigger_active_level: true
          trigger_period_us: 20000
  - module: QDU-Robomaster/CameraSync
    id: CameraSync_0
    args:
      - camera_pin: WebotsCamera_0
      - param:
          camera_sync_topic_name: '"camera_sync_result"'
          imu_topic_name: '"camera_gyro"'
          trigger_period_us: 20000
          camera_sync_command_topic_name: '"camera_sync_command"'
  - module: QDU-Robomaster/CameraFrameSync
    id: CameraFrameSync_0
    template_args:
      - 'AutoAimRunConfig::Webots::MainFrameLayout'
    args:
      - camera: WebotsCamera_0
      - runtime:
          - 'CameraFrameSyncMode::TRIGGER'  # mode
          - 0 # offset_us
          - '"libxr_def_domain"' # host_topic_domain_name
          - '"camera_sync_command"' # sync_command_topic_name
          - '"camera_sync_result"' # sync_result_topic_name
          - 1 # sync_active_level
          - 10000 # camera_settle_us
          - 'CameraFrameSyncRawImuFrame::BODY_X_RIGHT_Y_FORWARD_Z_UP' # raw_imu_frame
          - 'AutoAimRunConfig::Webots::MainQuatTopicName' # raw_quat_topic_name
  - module: QDU-Robomaster/ArmorDetector
    id: ArmorDetector_0
    template_args:
      - 'AutoAimRunConfig::Webots::MainFrameLayout'
    args:
      - sync: CameraFrameSync_0
      - cfg:
          detect_color: 2
          network:
            model: 'ArmorDetectorModel::OPENVINO_640X512'
            min_confidence: 0.1
            enable_quad_check: true
            min_quad_area_px: 16.0
            logit_threshold: 0.619
            nms_threshold: 0.45
            bbox_expand: 0.1
            max_detections: 128
          referee_auto_detect_color: false
          referee_domain: '"host"'
          referee_topic: '"robot_game_ref"'
          preview:
            enabled: true
            preview_window_name: '"armor_detector_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8080
            web_stream_name: '"armor_detector"'
            max_fps: 30.0
  - module: QDU-Robomaster/ArmorTracker
    id: ArmorTracker_0
    template_args:
      - 'AutoAimRunConfig::Webots::MainFrameLayout'
    args:
      - ramfs: ramfs
      - sync: CameraFrameSync_0
      - cfg:
          tracker:
            require_target_tag: false
            target_tag_id: -1
            min_detect_count: 2
            max_temp_lost_count: 15
            outpost_max_temp_lost_count: 75
            target_select:
              observed_count_weight: 1.6
              distance_weight: 2.0
              area_weight: 1.2
              spin_weight: 0.8
              angle_weight: 2.0
              max_distance_m: 8.0
              distance_span_m: 7.5
              area_norm_px: 6000.0
              observed_count_norm: 4.0
              max_spin_rad_s: 8.0
              max_angle_norm: 0.5
              detecting_scale: 0.55
              temp_lost_scale: 0.35
              switch_margin: 0.25
          extrinsic:
            camera_mount_to_body:
              rotation: [1.0, 0.0, 0.0, 0.0]
              translation: [0.0, 0.0, 0.0]
          preview:
            enabled: true
            preview_window_name: '"armor_tracker_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8080
            web_stream_name: '"armor_tracker"'
            max_fps: 30.0
  - module: QDU-Robomaster/Aimer
    id: aimer
    template_args:
      - 'AutoAimRunConfig::Webots::MainFrameLayout'
    args:
      - cfg:
          yaw_offset: 0.0
          roll_offset: 0.0
          yaw_rate_threshold: 2.0
          default_bullet_speed: 23.0
          min_valid_bullet_speed: 14.0
          ballistic_drag_k: 0.02
          ballistic_integration_dt_s: 0.001
          ballistic_max_iterations: 16
          ballistic_min_elevation_deg: -20.0
          ballistic_max_elevation_deg: 35.0
          auto_fire: true
          image_to_now_s: 0.0
          vision_to_command_delay_s: 0.0
          command_transport_delay_s: 0.0
          gimbal_response_delay_s: 0.0
          fire_delay_s: 0.0
          low_speed_extra_predict_s: 0.015
          high_speed_extra_predict_s: 0.03
          min_fire_threshold: 0.003
          max_fire_threshold: 0.05
          enable_mpc_plan: true
          mpc_fire_thresh: 0.05
          max_yaw_acc: 50.0
          q_yaw_pos: 9000000.0
          q_yaw_vel: 0.0
          r_yaw_acc: 1.0
          max_roll_acc: 100.0
          q_roll_pos: 9000000.0
          q_roll_vel: 0.0
          r_roll_acc: 1.0
          preview:
            enabled: true
            preview_window_name: '"aimer_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8080
            web_stream_name: '"aimer_preview"'
            max_fps: 30.0
          enable_runtime_log: true
          bullet_speed_log_delta: 0.05
          heat_log_delta: 1.0
          convert_raw_gimbal_quat_to_body: false
          referee_topic: '"robot_game_ref"'
      - calibration: 'AutoAimRunConfig::Webots::MainCameraCalibration'
  - module: QDU-Robomaster/WebotsGimbal
    id: WebotsGimbal_0
    args:
      - param:
          pid_pitch_angle: 'WebotsGimbal::DefaultPitchAnglePid()'
          pid_pitch_omega: 'WebotsGimbal::DefaultPitchOmegaPid()'
          pid_yaw_angle: 'WebotsGimbal::DefaultYawAnglePid()'
          pid_yaw_omega: 'WebotsGimbal::DefaultYawOmegaPid()'
          pitch_inertia: '0.00012f'
          yaw_inertia: '0.0002f'
          pitch_torque_limit: '0.035f'
          yaw_torque_limit: '0.04f'
          control_period_ms: '1'
          log_interval: '1000'
  - module: QDU-Robomaster/WebotsFireNotify
    id: WebotsFireNotify_0
    args:
      - param:
          bullet_speed: 23.0
          single_shot_heat: 10.0
          shooter_heat_limit: 240.0
          shooter_cooling_value: 40.0
          max_fire_frequency_hz: 20.0
          fire_delay_ms: 30.0
          state_publish_period_ms: 10
settings:
  monitor_sleep_ms: '1000'
