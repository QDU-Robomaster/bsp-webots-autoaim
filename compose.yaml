name: bsp-webots-autoaim

services:
  autoaim-build:
    image: bsp-webots-autoaim-webots:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    environment:
      WEBOTS_HOME: /usr/local/webots
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace
    command: ["/bin/bash", "/workspace/docker/entrypoints/build.sh"]

  autoaim-preview:
    image: bsp-webots-autoaim-webots:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    environment:
      WEBOTS_HOME: /usr/local/webots
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      XR_RUN_ROOT:
      XR_RUNTIME_SEC:
      XR_SIM_FLOW_RATE:
    volumes:
      - .:/workspace
    command: ["/bin/bash", "/workspace/docker/entrypoints/headless_preview.sh"]
