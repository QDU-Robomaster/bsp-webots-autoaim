name: build test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: build (${{ matrix.compiler.name }})
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      XR_REF_NAME: ${{ github.head_ref || github.ref_name }}
      XROBOT_REF: ${{ vars.XROBOT_REF || '' }}
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    steps:
    - uses: actions/checkout@v4
    - name: init submodule
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: Checkout matching XRobot tools
      shell: bash
      run: |
        set -euo pipefail
        selected="${XROBOT_REF:-}"
        if [[ -z "$selected" ]]; then
          if [[ -n "$(git ls-remote --heads https://github.com/xrobot-org/XRobot.git "refs/heads/$XR_REF_NAME")" ]]; then
            selected="refs/heads/$XR_REF_NAME"
          else
            selected=refs/heads/dev
          fi
        fi
        git init .ci-tools/XRobot
        git -C .ci-tools/XRobot remote add origin https://github.com/xrobot-org/XRobot.git
        git -C .ci-tools/XRobot fetch --depth=1 origin "$selected"
        git -C .ci-tools/XRobot checkout --detach FETCH_HEAD
        python3 -m pip install ./.ci-tools/XRobot
    - name: Resolve configured modules and generate the entry
      run: xrobot_setup --context-ref "refs/heads/$XR_REF_NAME" --register-source User/main.cpp
    - name: Verify the current Webots configuration
      run: |
        python3 tests/config_contract_test.py
        python3 tests/launcher_test.py
    - name: detect OpenVINO
      shell: bash
      run: |
        set -euo pipefail
        openvino_dir=""
        for root in /opt /usr/local /usr; do
          openvino_dir="$(find "$root" -type d -path '*/runtime/cmake' -print -quit 2>/dev/null || true)"
          if [ -n "$openvino_dir" ]; then
            break
          fi
        done
        if [ -z "$openvino_dir" ]; then
          echo "OpenVINO runtime CMake directory not found" >&2
          exit 1
        fi
        echo "OPENVINO_DIR=$openvino_dir" >> "$GITHUB_ENV"
    - name: config cmake
      run: >
        cmake . -Bbuild -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER="$CC"
        -DCMAKE_CXX_COMPILER="$CXX"
        -DOpenVINO_DIR="$OPENVINO_DIR"
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build
      run: cmake --build build
    - name: Check invalid flow-rate startup arguments
      run: python3 tests/startup_test.py build/rm_auto_aim
