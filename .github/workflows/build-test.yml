name: build

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

env:
  XR_REF_NAME: ${{ github.head_ref || github.ref_name }}
  XR_REF_KIND: ${{ github.ref_type }}
  XR_CONTEXT_REF: ${{ github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name) || format('refs/heads/{0}', github.head_ref || github.ref_name) }}
  XROBOT_REF: ${{ vars.XROBOT_REF || '' }}

jobs:
  build:
    name: build (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Init submodules
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: Fetch XRobot tools
      shell: bash
      run: |
        set -euo pipefail
        checkout_tool() {
          local repo="$1" directory="$2" selected="$3"
          if [[ -n "$selected" ]]; then
            if [[ "$selected" != refs/heads/* && "$selected" != refs/tags/* &&
                  ! "$selected" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Use a full refs/heads/, refs/tags/ or commit SHA for $directory" >&2
              return 1
            fi
          elif [[ "$XR_REF_KIND" == tag ]]; then
            selected="refs/tags/$XR_REF_NAME"
          elif [[ -n "$(git ls-remote --heads "$repo" "refs/heads/$XR_REF_NAME")" ]]; then
            selected="refs/heads/$XR_REF_NAME"
          else
            selected=refs/heads/dev
          fi
          git init "$directory"
          git -C "$directory" remote add origin "$repo"
          git -C "$directory" fetch --depth=1 origin "$selected"
          git -C "$directory" checkout --detach FETCH_HEAD
          git -C "$directory" submodule update --init --recursive --depth=1
        }
        checkout_tool https://github.com/xrobot-org/XRobot.git .ci-tools/XRobot "$XROBOT_REF"
    - name: Install XRobot tools
      run: python3 -m pip install ./.ci-tools/XRobot
    - name: Resolve locked modules and generate the entry
      run: xrobot_setup --frozen --context-ref "$XR_CONTEXT_REF" --register-source User/main.cpp
    - name: Check generated files are committed
      shell: bash
      run: |
        set -euo pipefail
        generated=(User/xrobot_main.hpp Modules/CMakeLists.txt xrobot.lock)
        if [[ -n "$(git status --porcelain -- "${generated[@]}")" ]]; then
          git status --short -- "${generated[@]}"
          git --no-pager diff -- "${generated[@]}"
          echo "::error::Generated files differ from the commit; regenerate them and commit the result"
          exit 1
        fi
    - name: Test the Webots configuration
      run: |
        python3 tests/config_contract_test.py
        python3 tests/launcher_test.py
    - name: Detect OpenVINO
      shell: bash
      run: |
        set -euo pipefail
        openvino_dir=""
        for root in /opt /usr/local /usr; do
          openvino_dir="$(find "$root" -type d -path '*/runtime/cmake' -print -quit 2>/dev/null || true)"
          if [ -n "$openvino_dir" ]; then
            break
          fi
        done
        if [ -z "$openvino_dir" ]; then
          echo "OpenVINO runtime CMake directory not found" >&2
          exit 1
        fi
        echo "OPENVINO_DIR=$openvino_dir" >> "$GITHUB_ENV"
    - name: Configure
      run: >
        cmake . -Bbuild -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER="$CC"
        -DCMAKE_CXX_COMPILER="$CXX"
        -DOpenVINO_DIR="$OPENVINO_DIR"
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: Build
      run: cmake --build build
    - name: Check invalid flow-rate startup arguments
      run: python3 tests/startup_test.py build/rm_auto_aim
